version: 2

models:
  - name: dim_customers
    columns:
      - name: customer_id
        data_tests: [not_null, unique]
  - name: dim_sellers
    columns:
      - name: seller_id
        data_tests: [not_null, unique]
  - name: dim_products
    columns:
      - name: product_id
        data_tests: [not_null, unique]
  - name: dim_date
    columns:
      - name: date_day
        data_tests: [not_null, unique]

  - name: fct_order_items
    description: "One row per order item. Incremental on _loaded_at."
    columns:
      - name: order_item_key
        data_tests: [not_null, unique]
      - name: customer_id
        data_tests:
          - relationships:
              to: ref('dim_customers')
              field: customer_id
      - name: product_id
        data_tests:
          - relationships:
              to: ref('dim_products')
              field: product_id
      - name: seller_id
        data_tests:
          - relationships:
              to: ref('dim_sellers')
              field: seller_id
      - name: purchase_date
        data_tests:
          - relationships:
              to: ref('dim_date')
              field: date_day
      - name: price
        data_tests: [not_null]
